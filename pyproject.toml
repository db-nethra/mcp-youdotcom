[project]
name = "youcom-mcp-server"
version = "0.1.0"
description = "You.com MCP server on Databricks Apps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "mcp[cli]>=1.10.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
youcom-mcp-server = "youcom_mcp_server.main:main"